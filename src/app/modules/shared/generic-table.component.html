<div class="table-wrapper">
  <div class="table-header">
    <h3 class="table-title">Datos</h3>
    <div class="search-box">
      <input
        type="text"
        placeholder="Buscar..."
        [(ngModel)]="searchValue"
        (ngModelChange)="onSearchChange()"
        class="search-input" />
      <button class="search-btn">🔍</button>
    </div>
  </div>

  <div class="table-content" [class.loading]="loading">
    <div *ngIf="loading" class="spinner">
      ⏳ Cargando...
    </div>

    <table class="data-table" *ngIf="!loading && displayData.length > 0">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col.label }}</th>
          <th *ngIf="showActions" style="text-align: center; width: 120px;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of displayData; trackBy: trackByRow">
          <td *ngFor="let col of columns">
            <ng-container [ngSwitch]="col.type || 'text'">
              <span
                *ngSwitchCase="'status'"
                class="status-badge"
                [ngClass]="'status-' + (getValue(row, col.key) || '').toLowerCase()">
                {{ getValue(row, col.key) ?? '-' }}
              </span>

              <button
                *ngSwitchCase="'count'"
                class="count-button"
                (click)="onAction('view', row)">
                Membresías ({{ getMembershipsCount(row) }})
              </button>

              <span *ngSwitchDefault>{{ getValue(row, col.key) ?? '-' }}</span>
            </ng-container>
          </td>
          <td *ngIf="showActions" style="text-align: center;">
            <button class="action-btn edit-btn" (click)="onAction('edit', row)" title="Editar">
              ✏️
            </button>
            <button class="action-btn delete-btn" (click)="onAction('delete', row)" title="Eliminar">
              🗑️
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!loading && displayData.length === 0" class="empty-state">
      No hay datos disponibles
    </div>
  </div>
</div>
