<nz-spin [nzSimple]="true" [nzSpinning]="loading">
  <form [formGroup]="form" class="membership-form">

    <!-- SECCIÓN 1: DATOS DEL CLIENTE -->
    <div class="form-section">
      <div class="section-header">
        <i nz-icon nzType="user" nzTheme="outline" nzSize="lg"></i>
        <h3>Información del Cliente</h3>
      </div>

      <div class="form-grid">
        <nz-form-item class="form-item-full">
          <nz-form-label nzRequired>Nombre del Cliente</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingresa el nombre">
            <input
              nz-input
              formControlName="customerName"
              placeholder="Nombre completo"
              nzSize="large"
              [disabled]="isEditMode"
              class="form-input" />
          </nz-form-control>
        </nz-form-item>

        <div class="form-row">
          <nz-form-item class="form-item-half">
            <nz-form-label nzRequired>Email</nz-form-label>
            <nz-form-control nzErrorTip="Por favor ingresa un email válido">
              <input
                nz-input
                formControlName="customerEmail"
                placeholder="correo@ejemplo.com"
                type="email"
                nzSize="large"
                [disabled]="isEditMode"
                class="form-input" />
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="form-item-half">
            <nz-form-label nzRequired>Teléfono</nz-form-label>
            <nz-form-control nzErrorTip="Por favor ingresa el teléfono">
              <input
                nz-input
                formControlName="customerPhone"
                placeholder="+503 XXXX XXXX"
                nzSize="large"
                [disabled]="isEditMode"
                class="form-input" />
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </div>

    <!-- DIVIDER -->
    <nz-divider></nz-divider>

    <!-- SECCIÓN 2: DATOS DE MEMBRESÍA -->
    <div class="form-section">
      <div class="section-header">
        <i nz-icon nzType="credit-card" nzTheme="outline" nzSize="lg"></i>
        <h3>Información de Membresía</h3>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <nz-form-item class="form-item-half">
            <nz-form-label nzRequired>Puntos Totales</nz-form-label>
            <nz-form-control nzErrorTip="Por favor ingresa un número válido">
              <nz-input-number
                formControlName="totalPoints"
                placeholder="0"
                nzSize="large"
                [nzMin]="0"
                [nzStep]="1"
                class="form-input-number">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item class="form-item-half">
            <nz-form-label nzRequired>Estado</nz-form-label>
            <nz-form-control nzErrorTip="Por favor selecciona un estado">
              <nz-select
                formControlName="status"
                nzPlaceHolder="Selecciona el estado"
                nzSize="large"
                class="form-select">
                <nz-option
                  *ngFor="let opt of statusOptions"
                  [nzValue]="opt.value"
                  [nzLabel]="opt.label">
                </nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </div>

    <!-- FOOTER BUTTONS -->
    <div class="form-footer">
      <button
        nz-button
        nzType="default"
        nzSize="large"
        type="button"
        (click)="onCancel()"
        class="btn-cancel">
        <i nz-icon nzType="close" nzTheme="outline"></i>
        Cancelar
      </button>
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        type="button"
        [disabled]="form.invalid || loading"
        (click)="onSubmit()"
        class="btn-submit">
        <i nz-icon nzType="check" nzTheme="outline"></i>
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </form>
</nz-spin>
