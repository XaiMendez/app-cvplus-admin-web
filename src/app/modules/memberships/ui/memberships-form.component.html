<div class="wrapper">
  <nz-spin [nzSimple]="true" [nzSpinning]="loading">
    <form [formGroup]="form">

      <!-- SECCIÓN 1: DATOS DEL CLIENTE -->
      <div class="form-section">
        <h3>👤 Información del Cliente</h3>

        <div class="form-grid">
          <div class="form-group">
            <label>Nombre:</label>
            <input
              nz-input
              formControlName="customerName"
              nzSize="large"
              placeholder="Nombre completo" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email:</label>
              <input
                nz-input
                formControlName="customerEmail"
                nzSize="large"
                nzType="email"
                placeholder="correo@ejemplo.com" />
            </div>

            <div class="form-group">
              <label>Teléfono:</label>
              <input
                nz-input
                formControlName="customerPhone"
                nzSize="large"
                placeholder="Teléfono" />
            </div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN 2: DATOS DE MEMBRESÍA -->
      <div class="form-section">
        <h3>💳 Información de Membresía</h3>

        <div class="form-grid">
          <div class="form-row">
            <div class="form-group">
              <label>Puntos Totales:</label>
              <nz-input-number
                formControlName="totalPoints"
                nzSize="large"
                nzMin="0"
                [nzStep]="1">
              </nz-input-number>
            </div>

            <div class="form-group">
              <label>Estado:</label>
              <nz-select
                formControlName="status"
                nzSize="large"
                nzPlaceHolder="Selecciona estado">
                <nz-option
                  *ngFor="let opt of statusOptions"
                  [nzValue]="opt.value"
                  [nzLabel]="opt.label">
                </nz-option>
              </nz-select>
            </div>
          </div>
        </div>
      </div>

      <!-- ERROR MESSAGE -->
      <div *ngIf="errorMessage" class="error-message">
        ❌ {{ errorMessage }}
      </div>

      <!-- BOTONES -->
      <div class="form-actions">
        <button
          nz-button
          nzType="default"
          nzSize="large"
          (click)="onCancel()"
          type="button">
          Cancelar
        </button>
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          [disabled]="form.invalid || loading"
          (click)="onSubmit()"
          type="button">
          {{ loading ? 'Guardando...' : 'Actualizar Membresía' }}
        </button>
      </div>
    </form>
  </nz-spin>
</div>
