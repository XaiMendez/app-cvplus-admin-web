<div class="page-header">
  <button nz-button nzType="text" (click)="onFormCancel()" class="back-btn">← Atrás</button>
  <h1>{{ isEditMode ? '✏️ Editar Membresía' : '➕ Crear Membresía' }}</h1>
</div>

<app-memberships-create
  *ngIf="!isEditMode"
  (submit)="onFormSubmit($event)"
  (cancel)="onFormCancel()">
</app-memberships-create>

<app-memberships-form
  *ngIf="isEditMode"
  [membership]="membership"
  (submit)="onFormSubmit($event)"
  (cancel)="onFormCancel()">
</app-memberships-form>
