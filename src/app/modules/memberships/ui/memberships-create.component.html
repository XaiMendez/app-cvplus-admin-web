<div class="wrapper">
  <h2>Crear Membresía</h2>

  <!-- STEP 1: SEARCH BY DUI -->
  <div class="search-section">
    <h3>1️⃣ Buscar Cliente por DUI</h3>

    <form [formGroup]="searchForm" class="search-form">
      <div class="search-group">
        <label>DUI:</label>
        <input
          nz-input
          formControlName="dui"
          nzSize="large"
          placeholder="Ingresa el DUI del cliente"
          nzType="text" />
      </div>

      <button
        nz-button
        nzType="primary"
        nzSize="large"
        [disabled]="searchForm.invalid || searching"
        (click)="searchCustomer()"
        type="button">
        {{ searching ? 'Buscando...' : 'Buscar' }}
      </button>
    </form>

    <!-- Search Error -->
    <div *ngIf="searchError" class="error-message">
      ❌ {{ searchError }}
    </div>
  </div>

  <!-- STEP 2: CUSTOMER DATA (Editable) -->
  <div *ngIf="customer" class="customer-section">
    <h3>2️⃣ Datos del Cliente (Editable)</h3>

    <form [formGroup]="membershipForm">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre:</label>
          <input
            nz-input
            formControlName="name"
            nzSize="large"
            placeholder="Nombre completo" />
        </div>

        <div class="form-group">
          <label>Email:</label>
          <input
            nz-input
            formControlName="email"
            nzSize="large"
            nzType="email"
            placeholder="email@example.com" />
        </div>

        <div class="form-group">
          <label>Teléfono:</label>
          <input
            nz-input
            formControlName="phone"
            nzSize="large"
            placeholder="Teléfono" />
        </div>
      </div>

      <!-- STEP 3: MEMBERSHIP DATA -->
      <h3>3️⃣ Datos de Membresía</h3>

      <div class="form-row">
        <div class="form-group">
          <label>Puntos Iniciales:</label>
          <nz-input-number
            formControlName="totalPoints"
            nzMin="0"
            nzSize="large"
            [nzStep]="1"></nz-input-number>
        </div>

        <div class="form-group">
          <label>Estado:</label>
          <nz-select
            formControlName="status"
            nzSize="large"
            nzPlaceHolder="Selecciona estado">
            <nz-option
              *ngFor="let opt of statusOptions"
              [nzValue]="opt.value"
              [nzLabel]="opt.label">
            </nz-option>
          </nz-select>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        ❌ {{ errorMessage }}
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button
          nz-button
          nzType="default"
          nzSize="large"
          (click)="onCancel()"
          type="button">
          Cancelar
        </button>
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          [disabled]="membershipForm.invalid || loading"
          (click)="onSubmit()"
          type="button">
          {{ loading ? 'Creando...' : 'Crear Membresía' }}
        </button>
      </div>
    </form>
  </div>
</div>
