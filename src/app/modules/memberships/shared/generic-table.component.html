<nz-card class="table-card">
  <div class="table-header">
    <h3 class="table-title">Datos</h3>
    <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
      <input
        type="text"
        nz-input
        placeholder="Buscar..."
        [(ngModel)]="searchValue"
        (ngModelChange)="onSearchChange()"
        nzSize="large" />
    </nz-input-group>
    <ng-template #suffixIconButton>
      <button nz-button nzType="primary" nzSize="large">
        <i nz-icon nzType="search"></i>
      </button>
    </ng-template>
  </div>

  <nz-spin [nzSimple]="true" [nzSpinning]="loading">
    <nz-table nzBordered [nzData]="displayData" nzSize="small" class="striped-table" [nzPageSize]="10" [nzFrontPagination]="true">
      <thead>
        <tr>
          <th *ngFor="let col of columns">{{ col.label }}</th>
          <th style="text-align: center; width: 120px;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of displayData; trackBy: trackByRow">
          <td *ngFor="let col of columns">
            <ng-container [ngSwitch]="col.type || 'text'">
              <nz-tag
                *ngSwitchCase="'status'"
                [nzColor]="getTagColor(getValue(row, col.key))">
                {{ getValue(row, col.key) ?? '-' }}
              </nz-tag>

              <button
                *ngSwitchCase="'count'"
                nz-button
                nzType="primary"
                nzSize="small"
                (click)="onAction('view', row)">
                Membresías ({{ getMembershipsCount(row) }})
              </button>

              <span *ngSwitchDefault>{{ getValue(row, col.key) ?? '-' }}</span>
            </ng-container>
          </td>
          <td style="text-align: center;">
            <button nz-button nzType="text" nzSize="small" (click)="onAction('edit', row)">
              <i nz-icon nzType="edit"></i>
            </button>
            <button nz-button nzType="text" nzDanger="true" nzSize="small" (click)="onAction('delete', row)">
              <i nz-icon nzType="delete"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </nz-spin>
</nz-card>
