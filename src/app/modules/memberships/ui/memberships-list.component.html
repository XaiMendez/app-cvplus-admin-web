<div class="memberships-container">
  <!-- HEADER CON TITULO Y BOTON -->
  <div class="memberships-header">
    <div class="header-left">
      <h1 class="page-title">Membresías</h1>
      <p class="page-subtitle">Gestiona todas las membresías de tus clientes</p>
    </div>
    <div class="header-right">
      <button nz-button nzType="primary" nzSize="large" (click)="onCreate()" class="btn-create">
        <i nz-icon nzType="plus" nzTheme="outline"></i>
        <span>Crear Membresía</span>
      </button>
    </div>
  </div>

  <!-- ALERTA DE ERROR -->
  @if (error) {
    <nz-alert
      nzType="error"
      [nzMessage]="error"
      nzShowIcon
      [nzCloseable]="false"
      class="error-alert">
    </nz-alert>
  }

  <!-- TABLA DE MEMBRESÍAS -->
  <div class="table-section">
    <app-memberships-table
      [data]="memberships"
      (editRow)="onEdit($event)"
      (deleteRow)="onDelete($event)">
    </app-memberships-table>
  </div>
</div>
