<nz-spin [nzSimple]="true" [nzSpinning]="loading">
  <nz-page-header
    [nzTitle]="isEditMode ? '✏️ Editar Membresía' : '➕ Crear Membresía'"
    nzBackIcon
    (nzBack)="onFormCancel()">
  </nz-page-header>

  <div class="form-container">
    @if (isEditMode) {
      <app-memberships-form
        [membership]="membership"
        (submit)="onFormSubmit($event)"
        (cancel)="onFormCancel()">
      </app-memberships-form>
    } @else {
      <app-memberships-create
        (submit)="onFormSubmit($event)"
        (cancel)="onFormCancel()">
      </app-memberships-create>
    }
  </div>
</nz-spin>
